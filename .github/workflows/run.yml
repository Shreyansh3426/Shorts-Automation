name: 🚀 Shorts Automation - Auto-Run & Self-Heal

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:        # Manual trigger button

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  auto-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt update && sudo apt install -y ffmpeg

      - name: 🗄️ Initialize database
        run: |
          python -c "from db import init_db; init_db(); print('✅ Database initialized')"

      - name: 🛡️ Run error recovery checks
        run: |
          echo "🔍 Running error recovery checks..."
          python error_recovery.py 2>&1 || echo "⚠️ Error recovery completed with warnings"

      - name: 🌐 Verify API keys
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "🔑 Verifying API configuration..."
          if [ -z "$GROQ_API_KEY" ]; then echo "❌ GROQ_API_KEY not set"; exit 1; fi
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "❌ YOUTUBE_API_KEY not set"; exit 1; fi
          if [ -z "$PEXELS_API_KEY" ]; then echo "❌ PEXELS_API_KEY not set"; exit 1; fi
          echo "✅ All API keys configured"

      - name: 🔐 Setup YouTube credentials
        continue-on-error: true
        run: |
          echo "🔓 Decoding YouTube credentials..."
          echo "${{ secrets.YOUTUBE_CREDENTIALS }}" | base64 -d > credentials.json
          echo "✅ Credentials file created"
          
          if [ -n "${{ secrets.YOUTUBE_TOKEN }}" ]; then
            echo "🔓 Decoding YouTube token..."
            echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > youtube_token.json
            echo "✅ Token file created"
          fi

      - name: 🎬 Run automation pipeline (Attempt 1)
        id: run_pipeline
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "🚀 Starting pipeline execution (Attempt 1)..."
          python -u auto_pipeline.py 2>&1 | tee pipeline.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Pipeline execution completed with exit code: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 🔄 Retry on failure (Attempt 2)
        if: steps.run_pipeline.outcome == 'failure'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "⚠️ Attempt 1 failed. Reinitializing and retrying..."
          python -c "from db import init_db; init_db()"
          sleep 5
          echo "🚀 Starting pipeline execution (Attempt 2)..."
          python -u auto_pipeline.py 2>&1 | tee -a pipeline.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Pipeline retry completed with exit code: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 📊 Check pipeline status
        id: check_status
        if: always()
        run: |
          if [ ! -f pipeline.log ]; then
            echo "⚠️ No pipeline.log file found - creating one"
            echo "Pipeline did not produce output" > pipeline.log
          fi
          
          if grep -q "❌\|Error: \|error:" pipeline.log 2>/dev/null || [ ! -f pipeline.log ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "⚠️ Pipeline had errors or no output"
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Pipeline completed"
          fi
          
          echo "=== Pipeline Log ===" 
          if [ -f pipeline.log ]; then tail -20 pipeline.log; fi

      - name: 💾 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: pipeline.log
          if-no-files-found: warn
          retention-days: 30

      - name: 📧 Workflow summary
        if: always()
        run: |
          echo "=== Workflow Execution Summary ===" 
          echo "Status: ${{ job.status }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          if [ "${{ job.status }}" == "failure" ]; then
            echo "❌ Workflow failed - check logs above for details"
          else
            echo "✅ Workflow completed"
          fi
